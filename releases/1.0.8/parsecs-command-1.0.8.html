<style>
/* Layout: operations board. Status bar on top, tab rail, then a working surface; map and region panel side by side on wide screens. */
:root{

  --accent:#B9770E; --accent-ink:#FFFFFF; --player:#2D5C8A; --enemy:#A8412A; --neutral:#8B928C;
  --good:#2E7A4D; --warn:#A86B12; --crit:#B23A2E; --hl:rgba(185,119,14,.14);
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A211E; --surface-2:#242D29; --ink:#E3E9E4; --muted:#98A49D; --line:#33403A;
  --accent:#E1A03A; --accent-ink:#17120A; --player:#6E9FD2; --enemy:#D9714D; --neutral:#79827C;
  --good:#5DB682; --warn:#DFA84A; --crit:#E2695B; --hl:rgba(225,160,58,.16); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A211E; --surface-2:#242D29; --ink:#E3E9E4; --muted:#98A49D; --line:#33403A;
  --accent:#E1A03A; --accent-ink:#17120A; --player:#6E9FD2; --enemy:#D9714D; --neutral:#79827C;
  --good:#5DB682; --warn:#DFA84A; --crit:#E2695B; --hl:rgba(225,160,58,.16); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.02em;text-wrap:balance;margin:0}
h3{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h4{margin:0;font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--player)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px}
.meta b{font-family:var(--f-mono);font-weight:500}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.coh{display:flex;align-items:center;gap:6px}
.pips{display:flex;gap:2px}
.pip{width:9px;height:14px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.pip.p{background:var(--player);border-color:var(--player)}
.pip.e{background:var(--enemy);border-color:var(--enemy)}
.spacer{flex:1}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:2px}

main{padding-block:18px 48px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}

.split.rules-split{grid-template-columns:260px minmax(0,1fr)}
@media (max-width:960px){.split,.split.rules-split{grid-template-columns:minmax(0,1fr)}}

hr{border:0;border-top:1px solid var(--line);margin:12px 0}

input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink);min-width:0;max-width:100%}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}

fieldset{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0;min-width:0}

.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-family:var(--f-mono);background:var(--bg);white-space:nowrap}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}

.unit{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}

.unit-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.figs .tbl td{padding:4px 8px}
.kia td{color:var(--muted);text-decoration:line-through}

.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapscroll{overflow-x:auto}
.mapbox svg{display:block;width:100%;height:auto;min-width:680px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}

.oporder{display:flex;flex-direction:column;gap:12px}

.oporder ul{margin:0;padding-left:18px}
.layoutbox{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}

.card-ev{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* 1.0 additions */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}

.rgrid input,.rgrid select{width:100%;font-size:12.5px;padding:4px 6px}

.status-placeholder{color:var(--warn)} .status-keyed{color:var(--player)} .status-verified{color:var(--good)}
.scene{border-left:4px solid var(--player);background:var(--surface);border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}

/* index-card battle pack */
.cards-preview{display:flex;flex-wrap:wrap;gap:12px}
.lib-split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}

.icard.c46{width:6in;height:4in;font-size:8.6pt}
.icard h5{margin:0;font-family:var(--f-display);font-size:11pt;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:6px;align-items:baseline}

  body{background:#fff !important;margin:0 !important;padding:0 !important}

  #printroot .sheet.l35{width:11in;height:8.5in;grid-template-columns:repeat(2,5in);grid-auto-rows:3in}
  #printroot .sheet.l46{width:8.5in;height:11in;grid-template-columns:6in;grid-auto-rows:4in}
  #printroot .sheet .icard{border:1px dashed #9a9a9a;page-break-after:auto;break-after:auto}

<body>
<div class="topbar"><div class="wrap topbar-in" id="topbar"></div></div>
<nav class="tabs wrap" id="tabs" role="tablist" aria-label="Portal sections"></nav>
<main class="wrap" id="view"></main>
<div id="modal"></div>
<div id="printroot"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============================================================
   PARSECS COMMAND PORTAL
   Source files in src/js are concatenated in name order by
   build.mjs into one <script>, so they share one global scope.
   Domain logic first (01–19, no DOM), UI after (20+).
   All book rolls go through die(); with app dice off, each step
   runs in a sandbox, collects the dice it needs, and asks once.
   ============================================================ */

/* ---------- RNG and dice service ---------- */
let S = null;
function hashSeed(str){ let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function rand(){ let t = (S.rngState = (S.rngState + 0x6D2B79F5) | 0); t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const d = n => 1 + Math.floor(rand() * n);
const pick = arr => arr[Math.floor(rand() * arr.length)];
function weighted(items, wfn){ const ws = items.map(wfn); const tot = ws.reduce((a, b) => a + b, 0); if (tot <= 0) return pick(items); let r = rand() * tot; for (let i = 0; i < items.length; i++){ r -= ws[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let uidN = 0; const uid = p => p + '-' + (Date.now() % 1e6).toString(36) + (uidN++).toString(36);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const half = v => Math.round(v * 2) / 2;

const DICE = { provided:[], idx:0, requests:[] };
function appDice(){ return !S.mods || S.mods.appDice !== false; }
function die(sides, label){
  if (appDice()) return d(sides);
  if (DICE.idx < DICE.provided.length) return DICE.provided[DICE.idx++];
  DICE.requests.push({ sides, label }); return 1 + Math.floor(Math.random() * sides);   /* sandbox roll, off the seeded stream, so the step can finish discovering what it needs */
}
const D6 = label => die(6, label);
const D100 = label => die(100, label);
const rollN = (n, s, label) => Array.from({ length:n }, (_, i) => die(s, n > 1 ? `${label} — die ${i + 1} of ${n}` : label));
const best2 = label => Math.max(die(6, label + ' — die 1 of 2'), die(6, label + ' — die 2 of 2'));

/* ---------- steps (resumable units of work that may need dice) ---------- */
const STEPS = {
  setup: () => generateCampaign(),
  phase: i => turnPhase(i),
  mission: opts => { const m = generateMission(opts); S.ui.mission = m.id; S.ui.tab = 'missions'; return m; },
  reveal: id => revealRound(id),
  result: (id, form) => recordResult(S.missions.find(m => m.id === id), form),
  event: (id, idx) => resolveEvent(S.inbox.find(e => e.id === id), idx),
  story: id => applyStory(id),
  paction: (id, txt) => playerAction(id, txt),
  raid: zid => commandoRaid(zid),
  rollstory: () => queueStory()
};

function runStep(key, args, provided){
  provided = provided || [];
  const snap = JSON.stringify(S);
  DICE.provided = provided; DICE.idx = 0; DICE.requests = [];
  const result = STEPS[key](...(args || []));
  if (DICE.requests.length){
    const reqs = DICE.requests.slice(); DICE.requests = [];
    S = JSON.parse(snap);
    S.pendingDice = { key, args:args || [], provided, requests:reqs };
    return { pending:true };
  }
  S.pendingDice = null; DICE.provided = []; DICE.idx = 0;
  return { ok:true, result };
}

function defaultRules(){ const tables = {}; Object.entries(TABLE_DEFS).forEach(([id, def]) => { tables[id] = { status:'placeholder', rows:def.rows(), updated:null }; }); return { v:1, tables }; }
let RULES = defaultRules();
function R(id){ const t = RULES.tables[id]; return t && t.rows && t.rows.length ? t.rows : TABLE_DEFS[id].rows(); }
function RP(key){ const r = R('params').find(x => x.key === key); return r ? Number(r.value) : TABLE_DEFS.params.rows().find(x => x.key === key).value; }
function lookup(id, v){ const rows = R(id); return rows.find(r => v <= Number(r.max)) || rows[rows.length - 1]; }
function rulesFlag(id){ const t = RULES.tables[id]; return t ? t.status : 'placeholder'; }
function validateTable(id, rows){
  const def = TABLE_DEFS[id]; const out = [];
  if (def.die){ let prev = 0;
    rows.forEach((r, i) => { const m = Number(r.max); if (!(m > prev)) out.push(`Row ${i + 1}: "${def.cols[0][1]}" must be higher than the row above (${prev}).`); prev = m; });
    if (prev !== def.die) out.push(`The last row must end at ${def.die}.`); }
  def.cols.forEach(([k, , type]) => { if (type === 'int' || type === 'num') rows.forEach((r, i) => { if (r[k] !== '' && r[k] != null && isNaN(Number(r[k]))) out.push(`Row ${i + 1}: ${k} is not a number.`); }); });
  if (id === 'enemyForces') rows.forEach((r, i) => ['slots','alt','alt2'].forEach(k => slotList(r[k]).forEach(s => { if (!SLOT_LABEL[s]) out.push(`Row ${i + 1}: "${s}" is not a slot key.`); })));
  if (id === 'injury') rows.forEach((r, i) => { if (r.effect === 'injured' && !diceExprOk(r.turns)) out.push(`Row ${i + 1}: turns "${r.turns || ''}" should look like 1, D3, D6 or D3+1.`); });
  return out;
}
const slotList = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const diceExprOk = s => /^\s*(\d+|\d*D\d+(\s*[+-]\s*\d+)?)\s*$/i.test(String(s || ''));
function rollExpr(expr, label){
  const s = String(expr || '0').toUpperCase().replace(/\s/g, ''); const m = s.match(/^(\d*)D(\d+)([+-]\d+)?$/);
  if (!m) return parseInt(s, 10) || 0;
  const n = parseInt(m[1] || '1', 10), sides = parseInt(m[2], 10); let t = 0; for (let i = 0; i < n; i++) t += die(sides, n > 1 ? `${label} (${i + 1} of ${n})` : label); return t + (parseInt(m[3] || '0', 10));
}

/* ---------- points (estimate fitted to published FCG profiles) ---------- */
/* Non-negative least squares over 16 per-figure costs (Dragoons, Serian, Bots, Horde, Swarm, special characters): mean error 0.73 pts. */
function PTS(){ const o = {}; R('points').forEach(r => o[r.key] = Number(r.value) || 0); return o; }
const profileKey = r => `${r.species} · ${r.profile}`;
function profileCost(key){ if (!key) return null; const r = R('profileCosts').find(x => profileKey(x) === key); return r ? Number(r.pts) || 0 : null; }
/* the sergeant of a squad priced as a species' Military profile is priced as that species' Sergeant/Minor */
function profileUp(key){ if (!key) return key; const up = key.replace(/ · (Military|Standard)$/, ' · Sergeant/Minor'); return profileCost(up) != null ? up : key; }
function saveSteps(sv){ const m = String(sv || '').match(/(\d)\+/); return m ? clamp(7 - parseInt(m[1], 10), 0, 5) : 0; }
function figPts(p, k){ k = k || PTS(); return Math.max(1, k.base + k.sp * (p.sp - 4) + k.re * (p.re - 1) + k.cs * p.cs + k.t * (p.t - 3) + k.kp * (p.kp - 1) + k.sv * p.sv + k.tr * p.tr + k.save * saveSteps(p.save)); }
function tplPoints(t){
  if (!t) return { v:0, est:false };
  if (t.pointsMode === 'manual') return { v:t.points || 0, est:false };
  const lead = t.leader ? 1 : 0; const rank = Math.max(0, t.size - lead); const k = PTS();
  const wp = id => { const w = weaponOf(id); return w ? (w.pts || 0) : 0; };
  const book = profileCost(t.priceAs), bookL = profileCost(t.leaderPriceAs || t.priceAs);
  const armor = p => ({ '6+':2, '5+':4 }[p && p.save] || 0);
  let estUsed = false;
  const one = (p, b) => { if (b != null) return b + armor(p); estUsed = true; return figPts(p, k); };
  if (t.troop === 'vehicle' && book != null) return { v:book + (/\bhero\b/i.test((t.rules || []).join(' ')) ? PTS().hero : 0), est:rulesFlag('profileCosts') === 'placeholder' };
  let v = rank * one(t.profile, book) + (lead ? one(t.leader, t.leaderPriceAs ? bookL : (book != null ? profileCost(profileUp(t.priceAs)) : null)) : 0);
  v += rank * (t.weapons || []).reduce((a, id) => a + wp(id), 0);
  v += (t.teamWeapons || []).reduce((a, id) => a + wp(id), 0);
  v += (t.leaderWeapons || []).reduce((a, id) => a + wp(id), 0);
  if (lead && !(t.leaderWeapons || []).length) v += (t.weapons || []).reduce((a, id) => a + wp(id), 0);
  const rules = (t.rules || []).join(' ').toLowerCase();
  if (t.troop === 'individual' && book == null) v += k.individual;
  if (/\bhero\b/.test(rules)) v += k.hero;
  if (/\bleader\b/.test(rules) && t.troop === 'individual') v += k.leader;
  return { v:Math.round(v), est:estUsed ? rulesFlag('points') !== 'verified' : rulesFlag('profileCosts') === 'placeholder' };
}

/* faction unit lists shared by the starter force and quick battles */
function factionLists(facId, allowVeh){
  const fac = S.armory.factions.find(f => f.id === facId) || { name:'Force', slots:{} };
  const ts = S.armory.templates.filter(t => t.faction === facId && (allowVeh !== false || t.troop !== 'vehicle'));
  const slotT = k => ts.find(t => t.id === (fac.slots || {})[k]);

  return { fac, ts, byPts,
    squads:uniq([slotT('infantry'), slotT('storm'), slotT('recon'), ...byPts(ts.filter(t => t.troop === 'squad'))]).filter(t => t.troop === 'squad'),
    leaders:uniq([slotT('majorChar'), ...ts.filter(t => t.troop === 'individual' && /\bleader\b/i.test((t.rules || []).join(' ')) && t.level !== 'epic'), ...ts.filter(t => t.troop === 'individual' && t.level !== 'epic')]),
    epics:ts.filter(t => t.troop === 'individual' && t.level === 'epic'),

}
/* turn a list of templates into named roster-style units */
function namedUnits(picks, facId, note){
  const machine = isMachineFaction(facId); const used = new Set(); const count = {};
  const code = t => (t.name.match(/\b([A-Z]{1,3}\d{0,3}(?:-\d+)?)\b/) || [null, t.name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase()])[1];
  const nameFor = (t, rank) => { let n, g = 0; do { n = machine ? `${code(t)}-${String(1000 + Math.floor(rand() * 9000))}` : `${rank ? rank + ' ' : ''}${pick(FIRST)} ${pick(LAST)}`; } while (used.has(n) && g++ < 50); used.add(n); return n; };
  return picks.map(t => { count[t.id] = (count[t.id] || 0) + 1;
    const nm = t.troop === 'individual' ? null : `${t.name}${picks.filter(x => x === t).length > 1 ? ' ' + count[t.id] : ''}`;
    const figs = Array.from({ length:t.size }, (_, i) => {
      const role = i === 0 && t.leader ? 'sergeant' : t.troop === 'team' ? 'crew' : t.troop === 'individual' ? 'leader' : 'trooper';
      const officer = t.level === 'minor' ? 'Lt.' : 'Capt.';
      const fn = t.troop === 'vehicle' || (t.troop === 'individual' && machine) ? `${t.name}${count[t.id] > 1 ? ' ' + count[t.id] : ''}` : nameFor(t, machine ? '' : role === 'sergeant' ? 'Sgt.' : t.troop === 'individual' ? officer : '');
      return newFig(fn, role); });
    return { id:uid('u'), tpl:t.id, name:nm || figs[0].name, formation:'fm-1', xp:0, skills:[], condition:{ state:'Okay', battles:0 }, tableReady:true, notes:note || '', figures:figs }; });
}
function starterRoster(facId, scale){
  const L = factionLists(facId); const plan = STARTER[scale || S.setup.scale] || STARTER.squad; const picks = [];
  const fill = L.squads.length ? L.squads : L.ts.filter(t => t.troop !== 'vehicle');
  const order = [0, 0, 1, 2]; /* line squads first, then storm and recon types */
  for (let i = 0; i < plan.squads && fill.length; i++) picks.push(fill[order[i] < fill.length ? order[i] : 0]);
  for (let i = 0; i < plan.leader && L.leaders.length; i++) picks.push(L.leaders[i % L.leaders.length]);
  for (let i = 0; i < plan.support && L.support.length; i++) picks.push(L.support[i % L.support.length]);
  return { formations:[{ id:'fm-1', name:L.fac.name }], history:[], units:namedUnits(picks, facId, 'Starter force.'), origin:'starter' };
}
/* make sure the chosen factions (and their templates and weapons) exist in an armory */
function carryFactions(target, source, ids){
  ids.filter(Boolean).forEach(id => {
    if (target.factions.some(f => f.id === id)) return; const f = source.factions.find(x => x.id === id); if (!f) return;
    target.factions.push(JSON.parse(JSON.stringify(f)));
    source.templates.filter(t => t.faction === id && !target.templates.some(x => x.id === t.id)).forEach(t => {
      target.templates.push(JSON.parse(JSON.stringify(t)));
      [...(t.weapons || []), ...(t.teamWeapons || []), ...(t.leaderWeapons || [])].forEach(wid => { if (!target.weapons.some(w => w.id === wid)){ const w = source.weapons.find(x => x.id === wid); if (w) target.weapons.push(JSON.parse(JSON.stringify(w))); } }); });
  });
  return target;
}

        map:null, zones:[], commitment:null, armory:sampleArmory(), roster:sampleRoster(), missions:[], inbox:[], journal:[], mods:defaultMods(), content:defaultContent(), scenes:[],

/* start a campaign for any pair of factions; carry = keep this campaign's armory and mods (and roster/content when the faction is unchanged) */
function startCampaign(setup, carry){

  const keep = { armory };

    else {
      const fac = S.armory.factions.find(f => f.id === setup.player);

      notes.push(S.roster.units.length ? `Starter force: ${S.roster.units.length} unit${S.roster.units.length > 1 ? 's' : ''} from ${fac ? fac.name : 'your faction'}.` : `${fac ? fac.name : 'Your faction'} has no templates yet; build units on the Armory tab, then add them on Forces.`);

/* bring any older save up to the current schema */
function migrate(o){
  if (!o || typeof o !== 'object' || !o.map) throw new Error('not a portal campaign');
  if (o.v === 2){
    o.v = 3; o.id = o.id || uid('c'); o.created = o.created || new Date().toISOString();
    o.content = o.content || defaultContent(); o.scenes = o.scenes || [];
    o.mods = Object.assign(defaultMods(), o.mods || {});
    (o.roster.units || []).forEach(u => u.figures.forEach(f => { ['xp','tokens','recover'].forEach(k => { if (f[k] == null) f[k] = 0; }); if (!f.adv) f.adv = {}; if (f.loadout === undefined) f.loadout = null; }));
    o.ui = Object.assign({ rulesTab:'enemyForces', wiz:null, pack:null, figOpen:null }, o.ui || {});

  if (o.v !== SCHEMA) throw new Error(`save schema ${o.v} is newer than this portal (${SCHEMA})`);
  o.mods = Object.assign(defaultMods(), o.mods); o.content = o.content || defaultContent(); o.scenes = o.scenes || [];

/* ---------- journal ---------- */
function stardate(turn){ const base = parseFloat(S.setup.stardate) || 2426.03; return (base + (turn - 1) * 0.01).toFixed(2); }
function log(type, text){ S.journal.unshift({ turn:S.turn, sd:stardate(S.turn), type, text, manual:!appDice() }); }

/* ---------- campaign / map generation ---------- */
function generateCampaign(){

  const W = 1000, H = 640, pad = 60; const pts = [];

    let bestP = null, bestD = -1;

  const wts = TYPE_WEIGHTS[st.world] || TYPE_WEIGHTS['Colony']; const used = new Set();
  const nodes = pts.map((p, i) => ({ id:i, x:Math.round(p.x), y:Math.round(p.y), type:weighted(REGION_TYPES, t => wts[t]), terrain:pick(WORLD_TERRAIN[st.world] || WORLD_TERRAIN.Colony), ctrl:'N', capital:null, poi:[], dq:0, name:'' }));

  let best = [0, 1, -1];

  nodes.forEach(n => {

    let nm; let tries = 0; do { nm = pick(NAME_ROOTS) + ' ' + pick(NAME_SUFFIX[n.type]); tries++; } while (used.has(nm) && tries < 40);

    n.poi = shuffle([...POI[n.type]]).slice(0, 2 + (rand() < 0.5 ? 1 : 0));

function isConnected(N, edges){ const dd = bfsDist(buildAdj(N, edges), 0); return dd.every(x => x >= 0); }
function buildAdj(N, edges){ const adj = Array.from({ length:N }, () => []); edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); }); return adj; }

function crosses(pts, edges, a, b){

const adjOf = id => buildAdj(S.map.nodes.length, S.map.edges)[id];
const regionOf = z => S.map.nodes[z.region];
const other = s => s === 'P' ? 'E' : 'P';
const sideName = s => s === 'P' ? 'Your forces' : enemyFaction().name;
function enemyFaction(){ return S.armory.factions.find(f => f.id === S.setup.opponent) || S.armory.factions.find(f => f.side === 'enemy') || { name:'Enemy', personality:'Methodical', slots:{} }; }

/* ---------- enemy AI ---------- */
function personality(side){ return side === 'E' ? (enemyFaction().personality || 'Methodical') : 'Player'; }
function scoreTarget(side, n){
  const p = personality(side); const opp = other(side);
  if (S.mods.bookAI && side === 'E') return 1;
  let s = 1; const oppCap = S.map.nodes.find(x => x.capital === opp); const nearCap = oppCap && adjOf(oppCap.id).includes(n.id);
  if (p === 'Aggressive'){ if (n.ctrl === opp) s += 3; if (nearCap) s += 3; }

  const who = s => s === 'P' ? 'your' : 'enemy';
  const strOf = s => {
    if (fixedStr) return fixedStr[s];
    const twoDice = why === 'step7' ? s === side : adjacentToTerritory(tgt.id, s);
    return twoDice ? best2(`${tgt.name}: ${who(s)} Army Strength (best of 2D6)`) : D6(`${tgt.name}: ${who(s)} Army Strength (1D6)`);

/* ---------- operational combat ---------- */
function combatDice(z, side, extra){
  const opp = other(side); let n = 1;
  if (!adjacentToTerritory(z.region, opp)) n++;
  if (z[side] - z[opp] >= 2) n++;
  const r = regionOf(z); if (r.type === 'Defensible' && r.ctrl === side && r.dq > 0) n++;

}
function opCombat(z, opts){

  let pbp = 0; if (depth === 0 && S.mods.autoPBP && z.pbp > 0){ pbp = z.pbp; z.pbp = 0; }
  const r = regionOf(z); const tag = depth ? ` (refight ${depth})` : '';

  const re = rollN(combatDice(z, 'E', (opts.extraE || 0) - (opts.minus || 0)), 6, `${r.name}${tag}: enemy combat dice`);

  else if (six(rp) >= 2 || six(re) >= 2){ const w = six(rp) >= 2 ? 'P' : 'E'; z[w]++; z[other(w)]--; out = `grand tactical success for ${w === 'P' ? 'you' : 'the enemy'}`; if (z[w] > z[other(w)]){ again = true; out += ', fight again'; } }
  else if (hi(rp) !== hi(re)){ const w = hi(rp) > hi(re) ? 'P' : 'E'; z[other(w)]--; out = `${w === 'P' ? 'you gain' : 'the enemy gains'} the upper hand`; if (r.type === 'Defensible' && r.ctrl === other(w) && r.dq > 0) r.dq--; }
  else if (hi(rp) >= 5){ z.P--; z.E--; out = 'brutal attrition: both lose 1'; }
  else { out = 'inconclusive fighting'; if (r.type === 'Urban'){ z.P--; z.E--; out += '; urban grind: both lose 1, fight again'; again = true; } }
  log('combat', `${r.name}: you roll [${rp.join(' ')}] vs [${re.join(' ')}]${pbp ? ` (spent ${pbp} PBP)` : ''}. ${cap(out)}. Strength ${before.P}–${before.E} → ${Math.max(0, z.P)}–${Math.max(0, z.E)}.`);

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function resolveZones(winners){

    const r = regionOf(z); const prior = r.ctrl;
    if (z.P <= 0 && z.E <= 0){ if (prior !== 'N') regionLost(prior, r); r.ctrl = 'N'; log('zone', `${r.name}: both armies destroyed. The region falls neutral.`); }
    else {
      const w = z.P > 0 ? 'P' : 'E';
      if (prior === other(w)) regionLost(prior, r);
      if (prior !== w){ if (r.type === 'Critical' && prior === 'N' && !r.critTaken){ r.critTaken = true; S.cohesion[w]++; log('cohesion', `${sideName(w)} take Critical ${r.name} first: +1 Cohesion.`); } r.ctrl = w; }

      log('zone', `${r.name} falls to ${w === 'P' ? 'your forces' : enemyFaction().name}.`);

function regionLost(side, r){

  if (r.type === 'Urban'){ loss++; why.push('Urban'); }
  if (r.type === 'Critical' && !r.critSpent){ loss++; r.critSpent = true; why.push('Critical'); }
  S.cohesion[side] = Math.max(0, S.cohesion[side] - loss);
  log('cohesion', `${side === 'P' ? 'Your' : 'Enemy'} Cohesion −${loss} (${why.join(', ')}): now ${S.cohesion[side]}.`);

/* ---------- operational orders ---------- */
function chooseZone(side, purpose){
  const opp = other(side); let zs = [...S.zones]; if (!zs.length) return null;
  const p = personality(side);
  if (S.mods.bookAI && side === 'E') return pick(zs);
  if (purpose === 'continue') zs = zs.filter(z => z[side] >= z[opp]);
  if (!zs.length) return null;
  const by = f => zs.sort((a, b) => f(a) - f(b))[0];
  if (purpose === 'raid') return by(z => -(z[opp] - z[side]));
  if (p === 'Aggressive') return by(z => z[opp]);
  if (p === 'Methodical') return by(z => z[side]);
  if (p === 'Opportunist') return by(z => (['Critical','Urban'].includes(regionOf(z).type) ? -10 : 0) + z[opp]);
  if (p === 'Raider') return by(z => -z[opp]);

function weakest(side){ return [...S.zones].sort((a, b) => a[side] - b[side])[0] || null; }
function doOrder(side, k){
  if (S.noOrders[side]){ log('order', `${sideName(side)} cannot issue orders this turn (loss of capability).`); return; }
  const opp = other(side); const who = side === 'P' ? 'You' : enemyFaction().name;
  const roll = D6(`${side === 'P' ? 'Your' : 'Enemy'} Operational Order${k ? ' (second order)' : ''}`); const row = lookup('orders', roll);
  const fx = ['fortify','continue','newOffensive','renew','raid','bolster']; const o = fx.indexOf(row.effect) + 1 || roll;

    if (S.setup.special && own.length){ const r = pick(own); r.type = 'Defensible'; r.dq = RP('dq'); log('order', txt + `${r.name} is fortified (Defense Quality ${r.dq}).`); }
    else { const z = weakest(side); if (z){ z[side]++; log('order', txt + `+1 Army Strength at ${regionOf(z).name}.`); } else log('order', txt + 'No army to reinforce.'); }
  } else if (o === 2){

}
function redeploy(side){
  const zs = S.zones.filter(z => z[side] > 0); if (zs.length < 2) return;

/* ---------- the operational turn, as five resumable phases ---------- */

  else if (i === 1){ for (const side of ['P','E']){ const n = 1 + (S.extraOrders[side] || 0); for (let k = 0; k < n; k++){ doOrder(side, k); resolveZones(winners); } } }

      if (res.length && S.zones.length){ const z = weakest(side); const r = D6(`${side === 'P' ? 'Your' : 'Enemy'} Resource roll (${res[0].name})`);

/* ---------- table layout with the four-tier terrain language ---------- */
function deployDepth(m){ const H = m.table[1];
  if (m.scenario === 'Skirmish') return Math.max(3, (H - 18) / 2);
  if (m.scenario === 'Battle') return Math.max(3, (H - 24) / 2);
  if (m.scenario === 'Grand Battle') return Math.max(3, (H - 30) / 2);
  return 6; }
function buildLayout(m){
  const [W, H] = m.table; const dep = deployDepth(m); const obj = [];
  const zx = () => (Math.floor(rand() * 6) + 0.5) * (W / 6);
  if (m.scenario === 'Evolving Objective'){ const belts = H >= 48 ? [[12, 24], [24, 36], [36, 48], [12, 24]] : [[12, 24], [12, 24], [24, 36]]; belts.slice(0, m.objectives.length).forEach((b, i) => obj.push({ x:zx(), y:H - (b[0] + rand() * (b[1] - b[0])), label:String(i + 1) })); }
  else if (m.scenario === 'Battle'){ const o = m.objectives[0].name;
    if (o === 'Hold the Field') [1, 2, 3].forEach(i => obj.push({ x:W * i / 4, y:H / 2, label:String(i) }));
    else if (o === 'Vital Ground') obj.push({ x:W / 2, y:H / 2, label:'V' });
    else if (o === 'Search and Retrieve') for (let i = 0; i < 6; i++) obj.push({ x:W * (i + 0.5) / 6, y:H / 2 + (i % 2 ? 4 : -4), label:String(i + 1) }); }
  else if (m.scenario === 'Skirmish') [[0, 0], [-8, 5], [8, -5]].forEach((o, i) => obj.push({ x:W / 2 + o[0], y:H / 2 + o[1], label:'T' + (i + 1) }));
  const pool = { micro:[], small:[], medium:[], large:[] };
  S.armory.terrain.forEach(t => { for (let i = 0; i < t.count; i++) (pool[t.tier] || pool.small).push({ ...t }); });
  Object.values(pool).forEach(shuffle);
  const cols = Math.max(1, Math.round(W / 12)), rows = Math.max(1, Math.round(H / 12)); const cw = W / cols, ch = H / rows;
  const cells = []; for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) cells.push({ c, r, d:Math.hypot((c + 0.5) * cw - W / 2, (r + 0.5) * ch - H / 2), used:0 });
  cells.sort((a, b) => a.d - b.d);
  const placed = [];
  const fits = (p, x, y, gap) => x >= 0.5 && y >= 0.5 && x + p.w <= W - 0.5 && y + p.h <= H - 0.5 && !placed.some(q => x < q.x + q.w + gap && x + p.w + gap > q.x && y < q.y + q.h + gap && y + p.h + gap > q.y);
  const place = (p, x0, y0, w0, h0, gap) => {
    let w = p.w, h = p.h; if (rand() < 0.4 && p.rules !== 'Hill'){ [w, h] = [h, w]; }
    for (let k = 0; k < 30; k++){ const x = x0 + rand() * Math.max(0.5, w0 - w), y = y0 + rand() * Math.max(0.5, h0 - h); const q = { ...p, w, h };
      if (fits(q, x, y, gap)){ placed.push({ ...q, x:half(x), y:half(y) }); return true; } }
    return false;
  };
  if (m.bigPiece && pool.large.length && W >= 36){ const p = pool.large.shift(); if (!place(p, W / 2 - p.w / 2 - 3, H / 2 - p.h / 2 - 3, p.w + 6, p.h + 6, 1)) pool.large.unshift(p); }
  for (const cell of cells){
    const x0 = cell.c * cw, y0 = cell.r * ch;
    const hasBig = placed.some(q => q.x < x0 + cw && q.x + q.w > x0 && q.y < y0 + ch && q.y + q.h > y0 && (q.tier === 'large' || q.tier === 'medium'));
    if (!hasBig && pool.medium.length && place(pool.medium[0], x0, y0, cw, ch, 1)) pool.medium.shift();
    const nSmall = hasBig || placed.some(q => q.tier === 'medium' && q.x >= x0 && q.x < x0 + cw && q.y >= y0 && q.y < y0 + ch) ? 1 : 2;
    for (let i = 0; i < nSmall && pool.small.length; i++) if (place(pool.small[0], x0, y0, cw, ch, 1)) pool.small.shift();
  }
  /* micro pieces cluster near larger pieces */
  const anchors = placed.filter(p => p.tier !== 'micro');
  let guard = 0;
  while (pool.micro.length && guard++ < 80){ const a = anchors.length ? pick(anchors) : { x:rand() * W, y:rand() * H, w:1, h:1 }; const p = pool.micro[0];
    if (place(p, a.x - 3, a.y - 3, a.w + 6, a.h + 6, 0.5)) pool.micro.shift(); else if (guard > 60){ const c = pick(cells); if (place(p, c.c * cw, c.r * ch, cw, ch, 0.5)) pool.micro.shift(); } }
  if (m.scenario === 'Skirmish'){
    const feats = placed.filter(p => p.tier !== 'micro').sort((a, b) => Math.hypot(a.x + a.w / 2 - W / 2, a.y + a.h / 2 - H / 2) - Math.hypot(b.x + b.w / 2 - W / 2, b.y + b.h / 2 - H / 2));
    feats.slice(0, 3).forEach((p, i) => { obj[i] = { x:p.x + 1.3, y:p.y + 1.3, label:'T' + (i + 1) }; });
  }
  const lanes = []; for (let x = 0; x + 6 <= W; x += 6){ const open = !placed.some(p => p.tier !== 'micro' && p.x < x + 6 && p.x + p.w > x); if (open){
    let fixed = false; const p = pool.small.shift() || pool.medium.shift();
    if (p){ for (let k = 0; k < 3 && !fixed; k++) fixed = place(p, x, dep + k * 4, 6, H - 2 * dep, 1); }
    lanes.push({ x, fixed }); } }
  return { W, H, dep, obj, terrain:placed, lanes, unused:Object.values(pool).reduce((a, l) => a + l.length, 0) };
}

/* ---------- post-battle ---------- */
/* normalise either the 0.2 result form ({units:{u:{figs,wiped}}}) or the 1.0 wizard form ({figs, wiped}) */
function normaliseResult(form){
  const out = { outcome:form.outcome || 'Victory', vp:parseInt(form.vp, 10) || 0, secondary:!!form.secondary, figs:{}, wiped:{}, unitNotes:form.unitNotes || {} };
  if (form.figs){ Object.assign(out.figs, form.figs); Object.assign(out.wiped, form.wiped || {}); }
  if (form.units) Object.entries(form.units).forEach(([uid_, uu]) => { if (uu.wiped) out.wiped[uid_] = true;
    Object.entries(uu.figs || {}).forEach(([fid, ff]) => { out.figs[fid] = { kills:ff.kills, state:ff.kia ? 'dead' : ff.wounded ? 'casualty' : 'ok' }; }); });
  return out;
}
function figXpOf(key){ const r = R('figXp').find(x => x.key === key); return r ? Number(r.xp) || 0 : 0; }
function giveAward(u, f, name, ctx){
  const a = awardOf(name) || { name, xp:0, tokens:0 };
  f.awards.push({ type:name, turn:S.turn, sd:stardate(S.turn), note:ctx && ctx.note || '', region:ctx && ctx.region || '' });
  if (a.xp){ if (S.mods.figureXP) f.xp += a.xp; else u.xp += a.xp; }
  if (a.tokens) f.tokens = (f.tokens || 0) + a.tokens;
  log('award', `${f.name} (${u.name}) receives the ${name}${a.xp ? `, +${a.xp} XP` : ''}${a.tokens ? `, ${a.tokens} ${S.content.tokenName || 'token'}${a.tokens > 1 ? 's' : ''}` : ''}.`);
  return a;
}
function rollUnitXp(u, outcome){
  const t = tplOf(u); const isInd = t && t.troop === 'individual';
  const row = R('unitXp').find(x => x.key === (isInd && outcome === 'Victory' ? 'indWin' : 'unit')) || { dice:'D6' };
  const dsc = String(row.dice || 'D6').trim().toLowerCase();
  if (dsc === 'best2') return best2(`Experience: ${u.name} (best of 2D6)`);
  if (/^\d+$/.test(dsc)) return parseInt(dsc, 10);
  return rollExpr(row.dice, `Experience: ${u.name}`);
}
function recordResult(m, rawForm){
  const form = normaliseResult(rawForm); const outcome = form.outcome; const vp = form.vp; const lines = []; const moments = [];
  const base = rollN(3, 6, 'Campaign Points (3D6, drop lowest)').sort((a, b) => b - a); const cpBase = base[0] + base[1];
  const cpBonus = vp > 0 ? vp : RP(outcome === 'Victory' ? 'cpWin' : outcome === 'Draw' ? 'cpDraw' : 'cpLoss');
  S.cp += cpBase + cpBonus; lines.push(`Campaign Points +${cpBase + cpBonus} (3D6 drop lowest [${base.join(' ')}] = ${cpBase}, +${cpBonus} ${vp > 0 ? 'for VP' : 'for the result'}).`);
  S.story++; lines.push('Story point +1.');
  if (form.secondary && m.secondary){ S.story++; lines.push(`Secondary objective achieved (${m.secondary}): story point +1.`); moments.push(`Secondary objective achieved: ${m.secondary}.`); }
  const casualties = [], dead = [], awarded = [];
  for (const uid_ of m.force){
    const u = S.roster.units.find(x => x.id === uid_); if (!u) continue;
    u.figures.forEach(f => {
      const ff = form.figs[f.id];
      if (!ff){ if (f.status === 'wounded' && !f.recover) f.status = 'active'; return; }
      const k = parseInt(ff.kills, 10) || 0; f.kills += k; if (k) moments.push(`${f.name}: ${k} kill${k > 1 ? 's' : ''}.`);
      let xp = 0, injXp = 0;
      if (ff.state === 'dead'){ f.status = 'kia'; f.diedAt = `${m.regionName}, Stardate ${m.sd}`; lines.push(`${f.name} killed in action.`); dead.push(f); }
      else if (ff.state === 'casualty'){
        f.wounds++; let v = D100(`Injury: ${f.name}`); let row = lookup('injury', v); let txt = `${row.result} (D100 ${v})`;
        if (ff.stab && S.mods.fieldStab){ const v2 = D100(`Injury reroll, ${f.name} was stabilized`); const r2 = lookup('injury', v2); txt += `; stabilized, reroll ${v2}: ${r2.result} stands`; row = r2; }
        injXp = Number(row.xp) || 0;
        if (row.effect === 'dead'){ f.status = 'kia'; f.diedAt = `${m.regionName}, Stardate ${m.sd}`; lines.push(`${f.name} became a casualty: ${txt}. Killed.`); dead.push(f); }
        else if (row.effect === 'injured'){ const t = Math.max(1, rollExpr(row.turns || '1', `Recovery time: ${f.name} (${row.turns || 1})`)); f.status = 'wounded'; f.recover = t; lines.push(`${f.name} became a casualty: ${txt}. Out for ${t} turn${t > 1 ? 's' : ''}.`); casualties.push(f); }
        else { if (f.status === 'wounded' && !f.recover) f.status = 'active'; lines.push(`${f.name} became a casualty: ${txt}.`); casualties.push(f); }
      } else if (f.status === 'wounded' && !f.recover) f.status = 'active';
      if (S.mods.figureXP && f.status !== 'kia'){
        xp = ff.state === 'casualty' ? figXpOf('casualty') : figXpOf(outcome === 'Victory' ? 'survivedWin' : 'survivedLoss');
        if (ff.first) xp += figXpOf('firstBlood'); if (ff.unique) xp += figXpOf('unique'); xp += k * figXpOf('perKill') + injXp;
        f.xp += xp; if (xp) lines.push(`${f.name} +${xp} XP.`);
      }
      if (ff.first) moments.push(`${f.name} drew first blood.`);
      if (ff.award){ giveAward(u, f, ff.award, { region:m.regionName, note:ff.note || '' }); awarded.push({ f, award:ff.award }); lines.push(`${f.name}: ${ff.award}.`); }
      if (ff.note && ff.note.trim()){ f.notes = (f.notes ? f.notes + '\n' : '') + `${m.sd}, ${m.regionName}: ${ff.note.trim()}`; moments.push(`${f.name}: ${ff.note.trim()}`); }
    });
    if (u.condition.battles > 0){ u.condition.battles--; if (u.condition.battles === 0 && u.condition.state !== 'Lost') u.condition = { state:'Okay', battles:0 }; }
    if (form.wiped[u.id]){
      const r = D6(`Unit Losses table: ${u.name}`); const row = lookup('unitLosses', r); const st = row.state || 'Okay';
      u.condition = { state:st, battles:Number(row.battles) || 0 }; lines.push(`${u.name} unit loss roll ${r}: ${st}.`);
      if (st === 'Lost') S.roster.history.push({ unit:u.name, reason:'Lost in action', sd:m.sd, region:m.regionName });
    }
    if (S.mods.skillCurrency !== 'cp'){ const uxp = rollUnitXp(u, outcome); u.xp += uxp; lines.push(`${u.name} +${uxp} unit XP.`); }
    if (form.unitNotes[u.id]) u.notes = (u.notes ? u.notes + '\n' : '') + `${m.sd}: ${form.unitNotes[u.id]}`;
  }
  S.roster.units = S.roster.units.filter(u => u.condition.state !== 'Lost');
  const z = S.zones.find(x => x.id === m.zoneId);
  if (z){ z.scouted = true; z.scoutedTurn = S.turn;
    if (outcome === 'Victory'){
      if (z.pbpTurn !== S.turn){ z.pbpTurn = S.turn; z.pbpThisTurn = 0; }
      if ((z.pbpThisTurn || 0) < RP('pbpPerTurn') && z.pbp < RP('pbpMax')){ z.pbp++; z.pbpThisTurn = (z.pbpThisTurn || 0) + 1; lines.push(`+1 Player Battle Point at ${m.regionName} (${z.pbp} saved).`); } else lines.push('Battle point cap reached for this zone.');
      if (m.critical){ const zz = S.zones.find(x => x.E >= 4); if (zz){ zz.E--; lines.push(`Critical Strike succeeds: −1 enemy strength at ${regionOf(zz).name}.`); resolveZones(null); } }
    } }
  if (S.mods.mercenary){ const mu = D6('Munitions Points') + (outcome === 'Victory' ? D6('Munitions: scavenging (you held the field)') : 0); S.munitions += mu; lines.push(`Munitions +${mu}.`); }
  S.lastResult = outcome; m.status = 'complete'; m.result = { outcome, vp, lines, moments, secondary:form.secondary, participants:Object.keys(form.figs) };
  log('battle', `${m.regionName} — ${outcome}${vp ? `, ${vp} VP` : ''}. ` + lines.join(' '));
  m.debriefId = debriefScene(m, { casualties, dead, awarded });
  queueMilestones();
  return lines;
}

/* ---------- narrative scenes ----------
   The portal owns structure: who speaks, when a scene fires, where it is kept.
   Words come from the voice cards in the content pack. Anything longer goes to chat as a scene packet. */
const voices = () => (S.content && S.content.voices) || [];
const voiceById = id => voices().find(v => v.id === id);
const voiceForFig = f => voices().find(v => v.figName && v.figName === f.name);
const vName = v => v ? `${v.rank} ${v.name}`.trim() : 'Command';
function fillLine(t, ctx){ return String(t).replace(/\{(\w+)\}/g, (mm, k) => ctx[k] != null && ctx[k] !== '' ? ctx[k] : mm); }
function lineOf(v, key, ctx){ const l = v && v.lines && v.lines[key]; if (!l || !l.length) return null; return fillLine(pick(l), ctx); }
function sceneMode(){ return (S.mods && S.mods.scenes) || 'events'; }
function forceUnits(m){ return (m.force || []).map(id => S.roster.units.find(u => u.id === id)).filter(Boolean); }
function missionCtx(m){
  const units = forceUnits(m); const u = units[0]; const t = u && tplOf(u);
  const lead = u && (u.figures.find(f => f.role === 'sergeant' && f.status === 'active') || u.figures.find(f => f.acting && f.status === 'active') || u.figures.find(f => f.status === 'active'));
  return { leader:lead ? lead.name : (u ? u.name : 'Commander'), unit:u ? u.name : 'your force', region:m.regionName, enemy:m.enemy ? m.enemy.faction : enemyFaction().name,
    theme:m.theme, poi:m.poi, support:(m.support || []).map(s => s.name).join(', ') || 'nothing extra', tier:m.tierName, troop:t ? t.troop : '' };
}
function pushScene(sc){ sc.id = uid('sc'); sc.turn = S.turn; sc.sd = stardate(S.turn); S.scenes = S.scenes || []; S.scenes.unshift(sc); return sc.id; }
function briefingFor(m){
  if (sceneMode() === 'off') return null;
  const v = voiceById(S.content.briefer); const ctx = missionCtx(m);
  const body = lineOf(v, m.stance, ctx) || `${m.theme}.`;
  const assets = m.support.length ? lineOf(v, 'assets', ctx) : lineOf(v, 'noassets', ctx);
  const obj = m.objectives.map(o => `  · ${o.name}: ${o.text}`).concat(m.secondary ? [`  · Secondary: ${m.secondary}`] : []).join('\n');
  const parts = [S.content.ordersHeader || 'ORDERS', `Stardate ${m.sd}`, '', lineOf(v, 'opener', ctx), '', body, '', 'Objectives', obj, '', assets, '', lineOf(v, 'close', ctx), '', v ? `— ${vName(v)}, ${v.post}` : ''];
  const text = parts.filter(x => x != null).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  const id = pushScene({ kind:'briefing', title:`Orders: ${m.theme}`, missionId:m.id, beats:[{ who:v ? v.id : null, line:text, orders:true }] });
  return { voice:v ? v.id : null, text, sceneId:id };
}
function squadTalk(m, info, beats){
  const took = new Set(m.result.participants || []);
  const alive = forceUnits(m).flatMap(u => u.figures.filter(f => f.status !== 'kia' && (!took.size || took.has(f.id))).map(f => ({ f, v:voiceForFig(f) }))).filter(x => x.v && x.v.kind === 'squad');
  if (!alive.length) return;
  const ctx = missionCtx(m); const used = new Set();
  const say = (key, fig) => { const cands = alive.filter(x => !used.has(x.v.id) && x.v.lines[key]); if (!cands.length) return; const c = pick(cands); used.add(c.v.id); beats.push({ who:c.v.id, line:fillLine(pick(c.v.lines[key]), { ...ctx, fig:fig ? fig.name : '' }) }); };
  beats.push({ stage:'Later, with the squad.' });
  if (info.dead.length) say('kia', info.dead[0]);
  info.casualties.slice(0, 1).forEach(f => say('casualty', f));
  say(m.result.outcome === 'Victory' ? 'victory' : 'defeat'); say('banter');
}
function debriefScene(m, info){
  const mode = sceneMode(); if (mode === 'off') return null;
  const ctx = missionCtx(m); const out = m.result.outcome; const beats = [{ stage:`After-action, ${m.regionName}. ${out}${m.result.vp ? `, ${m.result.vp} VP` : ''}.` }];
  const db = voiceById(S.content.debriefer); const cv = voiceById(S.content.casualtyVoice); const pv = voiceById(S.content.presenter);
  const l = lineOf(db, out === 'Victory' ? 'victory' : out === 'Draw' ? 'draw' : 'defeat', ctx); if (l) beats.push({ who:db.id, line:l });
  info.dead.forEach(f => { const v = cv && cv.lines.kia ? cv : db; const t = lineOf(v, 'kia', { ...ctx, fig:f.name }); if (t) beats.push({ who:v.id, line:t }); });
  info.casualties.forEach(f => { const t = lineOf(db, 'casualty', { ...ctx, fig:f.name }); if (t) beats.push({ who:db.id, line:t }); });
  info.awarded.forEach(a => { const t = lineOf(pv, 'award', { ...ctx, fig:a.f.name, award:a.award }); if (t) beats.push({ who:pv.id, line:t }); });
  const notable = info.dead.length || info.casualties.length || info.awarded.length || (m.result.moments || []).length;
  if (S.mods.squadTalk && (mode === 'every' || (mode === 'events' && notable))) squadTalk(m, info, beats);
  return pushScene({ kind:'debrief', title:`Debrief: ${m.regionName}`, missionId:m.id, beats });
}
function milestoneScene(kind, u, f, choiceText){
  if (!['events','every'].includes(sceneMode())) return null;
  const ctx = { fig:f.name, unit:u.name, region:myZone() ? regionOf(myZone()).name : S.setup.theater, award:choiceText };
  const beats = [{ stage:`${kind === 'wound2' ? 'The aid station' : 'Parade'}, ${S.setup.theater}.` }];
  if (kind === 'wound2'){ const v = voiceById(S.content.casualtyVoice); const t = lineOf(v, 'wound', ctx) || lineOf(v, 'casualty', ctx); if (t) beats.push({ who:v.id, line:t });
    const me = voiceForFig(f); const t2 = lineOf(me, 'banter', ctx); if (t2) beats.push({ who:me.id, line:t2 }); beats.push({ stage:choiceText }); }
  else { const v = voiceById(S.content.presenter); const t = lineOf(v, 'award', ctx); if (t) beats.push({ who:v.id, line:t }); else beats.push({ stage:choiceText }); }
  return pushScene({ kind:'milestone', title:kind === 'wound2' ? `Second wound: ${f.name}` : `Citation: ${f.name}`, beats });
}
function eventScene(ev){

function legality(t){
  const issues = []; const add = (lvl, msg) => issues.push({ lvl, msg });
  const ws = (t.weapons || []).map(weaponOf).filter(Boolean), tw = (t.teamWeapons || []).map(weaponOf).filter(Boolean), lw = (t.leaderWeapons || []).map(weaponOf).filter(Boolean);

  if (t.troop === 'squad'){
    if (t.size < 4 || t.size > 6) add('err', 'Squads run 4–6 figures.');
    if (!t.leader) add('wrn', 'Squads are led by a sergeant; add a leader profile.');
    if (tw.length > Math.max(1, Math.floor(t.size / 5))) add('err', `At most ${Math.max(1, Math.floor(t.size / 5))} team weapon(s) for ${t.size} figures.`);
    if ([...ws, ...tw, ...lw].some(w => ['Crewed','Vehicle'].includes(w.cat))) add('err', 'Squads cannot carry crewed or vehicle weapons.');
    if (!ws.some(w => ['Rifle','Sidearm','Melee'].includes(w.cat))) add('err', 'Rank-and-file need a rifle, sidearm or melee weapon.');
  }
  if (t.troop === 'team'){
    if (t.size !== 3) add('err', 'Weapon teams are a crew of 3.');
    if (tw.filter(w => ['Team','Crewed'].includes(w.cat)).length !== 1) add('err', 'A weapon team carries exactly one team or crewed weapon.');
  }
  if (t.troop === 'individual'){
    if (t.size !== 1) add('err', 'Individuals are a single figure.');
    if (!t.level) add('err', 'Pick a character level: minor, major or epic.');
    const main = ws.filter(w => !['Sidearm','Melee','Grenade'].includes(w.cat)); if (main.length > 2) add('err', 'Individuals carry at most 2 main weapons plus a sidearm or blade.');
  }
  if (t.troop === 'vehicle'){
    if (t.size !== 1) add('err', 'Vehicles are a single model.');
    if ([...ws, ...tw].some(w => !['Vehicle','Crewed','Team'].includes(w.cat))) add('wrn', 'Vehicle mounts usually take vehicle or crewed weapons.');
    if (p.kp < 3) add('wrn', 'Vehicles usually have 3 or more KP.');
  }
  const rng = (k, lo, hi, nm) => { if (p[k] < lo || p[k] > hi) add('wrn', `${nm} ${p[k]} is outside the published range (${lo} to ${hi}).`); };
  if (t.troop !== 'vehicle'){ rng('sp', 3, 8, 'Speed'); rng('re', 0, 5, 'Reaction'); rng('cs', -1, 3, 'Combat'); rng('t', 2, 7, 'Toughness'); rng('tr', -1, 3, 'Training'); rng('sv', -1, 3, 'Savvy'); }
  if (p.kp < 1) add('err', 'KP must be at least 1.');

}
const QUALITY = {

}

/* ---------- storage (1.0) ----------
   IndexedDB holds every campaign, the rules pack and the backup folder handle.
   localStorage mirrors the open campaign synchronously, so a crash between writes loses nothing.
   Under file:// both are shared by every local page and cleared with browsing data,
   so the backup folder (or a downloaded backup) is the record of truth. */
const DB_NAME = 'parsecs-command', DB_STORE = 'kv';

  if (!isBrowser) return false;

    const text = JSON.stringify(await backupBundle(reason), null, 1);

      const names = []; for await (const [n] of dirHandle.entries()) if (/^parsecs-backup-\d{8}-\d{4}\.json$/.test(n)) names.push(n);
      names.sort(); while (names.length > 30) await dirHandle.removeEntry(names.shift()); }

}

function newList(name, limit){ const l = { id:uid('list'), name:name || 'New list', limit:parseInt(limit, 10) || 0, entries:[], created:new Date().toISOString(), updated:new Date().toISOString() }; LISTS.push(l); S.ui.listId = l.id; saveLists(); return l; }
function activeList(){ return LISTS.find(l => l.id === S.ui.listId) || LISTS[0] || null; }
/* each entry carries a snapshot of its template, weapons and faction, so a list works in any campaign */
function listAdd(list, tplId, n){
  const t = S.armory.templates.find(x => x.id === tplId); if (!t || !list) return null;
  let e = list.entries.find(x => x.tpl.id === tplId);
  if (e){ e.count += n || 1; e.tpl = JSON.parse(JSON.stringify(t)); }
  else { const f = factionOf(t.faction);
    e = { id:uid('le'), count:n || 1, tpl:JSON.parse(JSON.stringify(t)), weapons:weaponIdsOf(t).map(weaponOf).filter(Boolean).map(w => JSON.parse(JSON.stringify(w))),
          faction:f ? { id:f.id, name:f.name, rules:f.rules || [], notes:f.notes || '', side:f.side, slots:f.slots || {}, personality:f.personality } : null, pts:tplPoints(t).v };
    list.entries.push(e); }
  e.pts = tplPoints(t).v; list.updated = new Date().toISOString(); saveLists(); return e;
}
function entryPts(e){ const live = S.armory.templates.find(x => x.id === e.tpl.id); return live ? tplPoints(live).v : e.pts; }
function listTotals(l){ return l.entries.reduce((a, e) => ({ pts:a.pts + entryPts(e) * e.count, units:a.units + e.count, figs:a.figs + e.tpl.size * e.count }), { pts:0, units:0, figs:0 }); }
/* copy any templates, weapons and factions a list needs into this campaign's armory */
function ensureListInArmory(l){
  let n = 0;
  l.entries.forEach(e => {
    if (!S.armory.templates.some(t => t.id === e.tpl.id)){ S.armory.templates.push(JSON.parse(JSON.stringify(e.tpl))); n++; }
    (e.weapons || []).forEach(w => { if (!S.armory.weapons.some(x => x.id === w.id)) S.armory.weapons.push(JSON.parse(JSON.stringify(w))); });
    if (e.faction && !S.armory.factions.some(f => f.id === e.faction.id)) S.armory.factions.push(JSON.parse(JSON.stringify(e.faction)));
  });
  return n;
}
function listFaction(l){ const c = {}; l.entries.forEach(e => { const k = e.tpl.faction || ''; c[k] = (c[k] || 0) + e.count; }); const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; return best ? best[0] : ''; }
/* named units for every entry, grouped by faction so naming matches the faction's style */
function unitsFromList(l, note){
  ensureListInArmory(l);
  const byFac = {}; l.entries.forEach(e => { const t = S.armory.templates.find(x => x.id === e.tpl.id); (byFac[t.faction || ''] = byFac[t.faction || ''] || []).push(...Array(e.count).fill(t)); });
  return Object.entries(byFac).flatMap(([fac, picks]) => namedUnits(picks, fac, note || `From list: ${l.name}`));
}
function listExport(l){ return { kind:'pcp-list', v:1, app:'Parsecs Command', exported:new Date().toISOString(), list:l }; }
function listImport(obj){
  const arr = obj && obj.kind === 'pcp-list' ? [obj.list] : obj && obj.kind === 'pcp-lists' ? obj.lists : Array.isArray(obj) ? obj : null;

const TROOP_LABEL = { squad:'Squad', team:'Weapon team', individual:'Character', vehicle:'Vehicle' };
function libFilter(){ return Object.assign({ fac:'', troop:'', min:'', max:'', q:'', sort:'name' }, S.ui.lib || {}); }
function libResults(){
  const f = libFilter(); const q = f.q.trim().toLowerCase();
  let ts = S.armory.templates.filter(t => (!f.fac || t.faction === f.fac) && (!f.troop || t.troop === f.troop));
  ts = ts.filter(t => { const p = tplPoints(t).v; return (f.min === '' || p >= +f.min) && (f.max === '' || p <= +f.max); });
  if (q) ts = ts.filter(t => [t.name, ...(t.rules || []), ...weaponIdsOf(t).map(id => (weaponOf(id) || {}).name || ''), (factionOf(t.faction) || {}).name || ''].join(' ').toLowerCase().includes(q));
  const by = { name:(a, b) => a.name.localeCompare(b.name), pts:(a, b) => tplPoints(a).v - tplPoints(b).v, ptsdesc:(a, b) => tplPoints(b).v - tplPoints(a).v, faction:(a, b) => ((factionOf(a.faction) || {}).name || '').localeCompare((factionOf(b.faction) || {}).name || '') || a.name.localeCompare(b.name) }[f.sort] || ((a, b) => a.name.localeCompare(b.name));
  return ts.sort(by);
}

    L.terrain.forEach(p => { const x = pad + p.x * s, y = pad + p.y * s, w = p.w * s, h = p.h * s; const op = { large:0.85, medium:0.55, small:0.4, micro:0.3 }[p.tier] || 0.5;
      if (p.rules === 'Hill') g += `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" fill="var(--surface-2)" stroke="var(--muted)"/><ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 3.4}" ry="${h / 3.4}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
      else if (p.rules === 'Area') g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2.4}" fill="var(--good)" fill-opacity="${p.tier === 'micro' ? 0.25 : 0.16}" stroke="var(--good)" stroke-dasharray="4 3"/>`;
      else if (p.rules === 'Impassable') g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--crit)" fill-opacity="0.18" stroke="var(--crit)"/>`;
      else if (p.rules === 'Linear') g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--ink)" fill-opacity="${p.tier === 'micro' ? 0.5 : 0.75}"/>`;
      else if (p.rules === 'Building'){ g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--muted)" fill-opacity="${op}" stroke="var(--ink)" stroke-width="${p.tier === 'large' ? 2 : 1}"/>`; if (p.tier === 'large') g += `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h * 0.6}" stroke="var(--surface)" stroke-width="2"/><line x1="${x}" y1="${y + h / 2}" x2="${x + w * 0.4}" y2="${y + h / 2}" stroke="var(--surface)" stroke-width="2"/>`; }
      else if (p.rules === 'Solid') g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--neutral)" fill-opacity="0.75" stroke="var(--ink)" stroke-width="0.8"/>`;
      else g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${p.tier === 'micro' ? 4 : 1}" fill="var(--neutral)" fill-opacity="${op}" stroke="var(--ink)" stroke-width="0.6"/>`;
      if (p.tier !== 'micro' && p.w * p.h >= 20) g += `<text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Sans, sans-serif" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${esc(p.name)}</text>`; });
  }
  L.obj.forEach(o => { const x = pad + o.x * s, y = pad + o.y * s; g += `<circle cx="${x}" cy="${y}" r="11" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace" fill="var(--accent-ink)">${esc(o.label)}</text>`; });
  g += `<text x="${pad + W / 2}" y="${pad + H + 18}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${L.W}" · grid 6"</text><text x="${pad + W + 14}" y="${pad + H / 2}" transform="rotate(90 ${pad + W + 14} ${pad + H / 2})" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${L.H}"</text>`;
  return g + `</svg>`;
}

/* ----- post-battle wizard ----- */
const WIZ_STEPS = ['Outcome','Casualties','Experience','Awards and notes','Review'];
function wizStart(m){
  const figs = {}; forceUnits(m).forEach(u => u.figures.filter(f => f.status === 'active').forEach(f => { figs[f.id] = { u:u.id, kills:0, state:'ok', stab:false, first:false, unique:false, award:'', note:'' }; }));
  S.ui.wiz = { mid:m.id, step:0, data:{ outcome:'Victory', vp:0, secondary:false, figs, wiped:{}, unitNotes:{} } };
}
function wizFigRows(m, fn){ const d = S.ui.wiz.data; return forceUnits(m).map(u => { const fs = u.figures.filter(f => d.figs[f.id]); if (!fs.length) return ''; return fn(u, fs); }).join(''); }
function wizXpPreview(f, ff, outcome){
  if (!S.mods.figureXP || ff.state === 'dead') return ''; let x = ff.state === 'casualty' ? figXpOf('casualty') : figXpOf(outcome === 'Victory' ? 'survivedWin' : 'survivedLoss');
  if (ff.first) x += figXpOf('firstBlood'); if (ff.unique) x += figXpOf('unique'); x += (parseInt(ff.kills, 10) || 0) * figXpOf('perKill'); return `+${x} XP${ff.state === 'casualty' ? ' (plus any injury bonus)' : ''}`;
}
function wizardPanel(m){
  const w = S.ui.wiz;
  if (!w || w.mid !== m.id) return `<div class="panel stack"><div class="panel-h"><h3>After the battle</h3></div><p class="small muted" style="margin:0">A five-step after-action report: outcome, casualties and injuries, experience, awards and notes, then a review before any dice are rolled.</p>
    <div class="row"><button class="btn primary" type="button" data-act="wizstart" data-id="${m.id}" ${S.pendingDice ? 'disabled' : ''}>Start the after-action report</button></div></div>`;
  const d = w.data; const st = w.step;
  const steps = `<div class="steps">${WIZ_STEPS.map((x, i) => `<span class="${i === st ? 'on' : i < st ? 'done' : ''}">${i + 1}. ${x}</span>`).join('')}</div>`;
  let body = '';
  if (st === 0){
    body = `<div class="row"><div class="seg" role="radiogroup" aria-label="Outcome">${['Victory','Draw','Defeat'].map(o => `<label class="chk" style="padding:4px 10px"><input type="radio" name="outcome" value="${o}" ${d.outcome === o ? 'checked' : ''}> ${o}</label>`).join('')}</div>
      <label class="f"><span>Victory points (0 if none)</span><input type="number" name="vp" id="wz-vp" value="${d.vp}" min="0" style="width:90px"></label></div>
      ${m.secondary ? `<label class="chk"><input type="checkbox" name="secondary" ${d.secondary ? 'checked' : ''}> Secondary objective achieved: ${esc(m.secondary)}</label>` : ''}`;
  } else if (st === 1){
    body = `<p class="small muted" style="margin:0">Casualties roll on the Casualty Injury table${rulesFlag('injury') === 'placeholder' ? ' (placeholder values until you key it in)' : ''}. ${S.mods.fieldStab ? 'Tick Stabilized for a figure treated on the table: it rerolls and the second result stands.' : ''} Mark Killed only for a death the story already decided.</p>` +
      wizFigRows(m, (u, fs) => `<div class="tblwrap"><table class="tbl"><thead><tr><th>${esc(u.name)}</th><th class="num">Kills</th><th>Result</th>${S.mods.fieldStab ? '<th>Stabilized</th>' : ''}</tr></thead><tbody>
        ${fs.map(f => { const ff = d.figs[f.id]; return `<tr><td>${esc(f.name)}</td><td class="num"><input type="number" min="0" value="${ff.kills}" style="width:60px" name="k|${f.id}" aria-label="Kills by ${esc(f.name)}"></td>
          <td><select name="s|${f.id}" aria-label="${esc(f.name)} result">${[['ok','Fine'],['casualty','Casualty (roll injury)'],['dead','Killed']].map(([k, l]) => `<option value="${k}" ${ff.state === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
          ${S.mods.fieldStab ? `<td><input type="checkbox" name="st|${f.id}" ${ff.stab ? 'checked' : ''} aria-label="${esc(f.name)} stabilized"></td>` : ''}</tr>`; }).join('')}
        <tr><td colspan="4"><label class="chk small"><input type="checkbox" name="wipe|${u.id}" ${d.wiped[u.id] ? 'checked' : ''}> Whole unit became casualties (roll Unit Losses)</label></td></tr></tbody></table></div>`);
  } else if (st === 2){
    body = `<p class="small muted" style="margin:0">${S.mods.figureXP ? 'Named figures earn XP from the Figure Experience table; units also roll unit XP.' : 'Units roll unit XP. Turn on per-figure XP in Mods to track XP for each named figure.'}</p>` +
      wizFigRows(m, (u, fs) => `<div class="tblwrap"><table class="tbl"><thead><tr><th>${esc(u.name)}</th><th>First blood</th><th>Killed a unique enemy</th>${S.mods.figureXP ? '<th>XP</th>' : ''}</tr></thead><tbody>
        ${fs.map(f => { const ff = d.figs[f.id]; return `<tr><td>${esc(f.name)}${ff.state !== 'ok' ? ` <span class="pill ${ff.state === 'dead' ? 'crit' : 'warn'}">${ff.state === 'dead' ? 'Killed' : 'Casualty'}</span>` : ''}</td>
          <td><input type="radio" name="first" value="${f.id}" ${ff.first ? 'checked' : ''} aria-label="${esc(f.name)} drew first blood"></td><td><input type="checkbox" name="un|${f.id}" ${ff.unique ? 'checked' : ''} aria-label="${esc(f.name)} killed a unique enemy"></td>
          ${S.mods.figureXP ? `<td class="mono small">${wizXpPreview(f, ff, d.outcome)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`) +
      `<label class="chk small"><input type="radio" name="first" value="" ${Object.values(d.figs).some(x => x.first) ? '' : 'checked'}> Nobody on your side drew first blood</label>`;
  } else if (st === 3){
    body = `<p class="small muted" style="margin:0">Notes go on each figure's record and into the scene packet. Awards apply their XP and ${esc(S.content.tokenName || 'tokens')} when you apply the report.</p>` +
      wizFigRows(m, (u, fs) => `<div class="tblwrap"><table class="tbl"><thead><tr><th>${esc(u.name)}</th><th>Award</th><th>What happened</th></tr></thead><tbody>
        ${fs.map(f => { const ff = d.figs[f.id]; return `<tr><td>${esc(f.name)}</td><td><select name="aw|${f.id}" aria-label="Award for ${esc(f.name)}"><option value="">—</option>${awardList().map(a => `<option ${ff.award === a.name ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></td>
          <td><input type="text" name="nt|${f.id}" value="${esc(ff.note)}" placeholder="Held the door alone" style="width:100%" aria-label="Note for ${esc(f.name)}"></td></tr>`; }).join('')}
        <tr><td colspan="3"><input type="text" name="unote|${u.id}" value="${esc(d.unitNotes[u.id] || '')}" placeholder="Unit note for the record" style="width:100%" aria-label="Note for ${esc(u.name)}"></td></tr></tbody></table></div>`);
  } else {
    const cas = Object.entries(d.figs).filter(([, x]) => x.state === 'casualty'); const all = forceUnits(m).flatMap(u => u.figures); const nm = id => (all.find(f => f.id === id) || {}).name;
    const dice = ['Campaign Points: 3D6, drop the lowest'];
    cas.forEach(([id, x]) => { dice.push(`Injury for ${nm(id)}: D100${x.stab && S.mods.fieldStab ? ', then a reroll that stands' : ''}, plus recovery time if out of action`); });
    Object.keys(d.wiped).filter(k => d.wiped[k]).forEach(k => dice.push(`Unit Losses for ${S.roster.units.find(u => u.id === k).name}: D6`));
    forceUnits(m).forEach(u => dice.push(`Unit XP for ${u.name}`));
    const awards = Object.entries(d.figs).filter(([, x]) => x.award);
    body = `<div class="cols-2"><div><h4>Entered</h4><ul class="small"><li>${esc(d.outcome)}${d.vp ? `, ${d.vp} VP` : ''}${d.secondary ? '; secondary achieved' : ''}</li>
        ${Object.entries(d.figs).filter(([, x]) => x.kills > 0 || x.state !== 'ok' || x.first).map(([id, x]) => `<li>${esc(nm(id))}: ${[x.kills > 0 ? `${x.kills} kill${x.kills > 1 ? 's' : ''}` : '', x.state === 'casualty' ? 'casualty' : x.state === 'dead' ? 'killed' : '', x.first ? 'first blood' : ''].filter(Boolean).join(', ')}</li>`).join('')}
        ${awards.map(([id, x]) => `<li>${esc(nm(id))}: ${esc(x.award)}</li>`).join('')}</ul></div>
      <div><h4>Dice to roll</h4><ul class="small">${dice.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="small muted">${appDice() ? 'The portal rolls them when you apply.' : 'You will be asked for them on one card when you apply.'}</p></div></div>`;
  }
  const last = st === WIZ_STEPS.length - 1;
  return `<form class="panel stack" data-form="wiz" data-id="${m.id}"><div class="panel-h"><h3>After-action report</h3><button class="btn sm" type="button" data-act="wizcancel">Discard report</button></div>${steps}${body}
    <div class="row">${st > 0 ? '<button class="btn" type="submit" name="dir" value="back">Back</button>' : ''}<button class="btn primary" type="submit" name="dir" value="${last ? 'apply' : 'next'}" ${S.pendingDice ? 'disabled' : ''}>${last ? 'Apply the report' : 'Next'}</button></div></form>`;
}
function wizCollect(f, fd){
  const w = S.ui.wiz; const d = w.data; const st = w.step;
  if (st === 0){ d.outcome = fd.get('outcome') || 'Victory'; d.vp = parseInt(fd.get('vp'), 10) || 0; d.secondary = !!fd.get('secondary'); }
  if (st === 1){ Object.keys(d.figs).forEach(id => { if (fd.has('k|' + id)){ d.figs[id].kills = parseInt(fd.get('k|' + id), 10) || 0; d.figs[id].state = fd.get('s|' + id) || 'ok'; d.figs[id].stab = !!fd.get('st|' + id); } });
    forceUnits(S.missions.find(x => x.id === w.mid)).forEach(u => { d.wiped[u.id] = !!fd.get('wipe|' + u.id); }); }
  if (st === 2){ const first = fd.get('first'); Object.keys(d.figs).forEach(id => { d.figs[id].first = first === id; d.figs[id].unique = !!fd.get('un|' + id); }); }
  if (st === 3){ Object.keys(d.figs).forEach(id => { if (fd.has('aw|' + id)){ d.figs[id].award = fd.get('aw|' + id) || ''; d.figs[id].note = fd.get('nt|' + id) || ''; } });
    for (const [k, v] of fd.entries()) if (k.startsWith('unote|')) d.unitNotes[k.slice(6)] = v; }
}
function sceneCard(sc){
  return `<article class="scene"><div class="row"><span class="pill info">${esc(sc.kind)}</span><h3 style="flex:1">${esc(sc.title)}</h3><span class="mono small muted">T${sc.turn} · ${sc.sd}</span><button class="btn sm" type="button" data-act="copyscene" data-id="${sc.id}">Copy</button></div>

function ruleRows(id){ return RULE_DRAFT && RULE_DRAFT.id === id ? RULE_DRAFT.rows : JSON.parse(JSON.stringify(R(id))); }
function viewRules(){

function ruleFormRows(id, fd){
  const def = TABLE_DEFS[id]; const base = ruleRows(id); const rows = base.map(r => ({ ...r }));
  for (const [k, v] of fd.entries()){ const p = k.split('|'); if (p[0] !== 'c') continue; const i = parseInt(p[1], 10); const col = def.cols.find(c => c[0] === p[2]); if (!rows[i] || !col) continue;
    rows[i][p[2]] = col[2] === 'int' ? (v === '' ? '' : parseInt(v, 10)) : col[2] === 'num' ? (v === '' ? '' : parseFloat(v)) : v; }
  return rows;
}
function parsePasted(id, text){
  const def = TABLE_DEFS[id]; return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const parts = l.split(/\t|\||;/).map(x => x.trim()); const r = {};
    def.cols.forEach(([k, , type, opts], i) => { let v = parts[i] == null ? '' : parts[i];
      if (type === 'int') v = parseInt(String(v).replace(/^.*[–-]\s*/, ''), 10) || 0; else if (type === 'num') v = parseFloat(v) || 0;
      else if (type === 'sel'){ const hit = opts.find(([ov, ol]) => ov.toLowerCase() === String(v).toLowerCase() || ol.toLowerCase() === String(v).toLowerCase()); v = hit ? hit[0] : ''; }
      r[k] = v; }); return r; });
}

function copyText(text, msg){

function onBuilderInput(e){

async function fileLoaded(kind, text){
  let o; try { o = JSON.parse(text); } catch (e) { toast('That file is not JSON.'); return; }
  if (kind === 'rulesfile'){ if (!o.tables){ toast('That is not a rules pack.'); return; } RULES = mergeRules(o); saveRules(); toast('Rules pack imported.'); render(); return; }
  if (kind === 'impufile'){ try { MODAL = { kind:'import', items:planImport(o) }; renderModal(); } catch (e) { toast('Import failed: ' + e.message); } return; }
  if (o.kind === 'pcp-backup'){ MODAL = { kind:'restore', obj:o }; renderModal(); return; }
  try { const c = migrate(o); save(); if (META.campaigns.some(x => x.id === c.id)){ if (!confirm(`"${c.setup.name}" is already on this computer. Replace it with the file? (Cancel keeps both: the file opens as a copy.)`)){ c.id = uid('c'); c.setup.name += ' (imported)'; } }
    c.savedAt = null; S = c; save(); toast('Campaign opened.'); render(); } catch (e) { toast('Not a campaign or backup: ' + e.message); }
}

}
